version: '3.8'

services:
  frontend:
    image: covenant-match-frontend:latest
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: production
    deploy:
      replicas: 2
      restart_policy:
        condition: on-failure
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_BASE_URL=/api
      - NEXT_PUBLIC_RECAPTCHA_SITE_KEY=6LeIxAcTAAAAAJcZVRqyHh71UMIEGNQ_MXjiZKhI
    depends_on:
      - backend
    networks:
      - covenant-network

  backend:
    image: covenant-match-backend:latest
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    deploy:
      replicas: 2
      restart_policy:
        condition: on-failure
    environment:
      - RUST_LOG=info
      - PORT=8080
      - CAPTCHA_ATTEMPTS_THRESHOLD=3
      - CAPTCHA_WINDOW_MINUTES=30
      - LOGIN_ATTEMPTS_RETENTION_DAYS=30
      - LOGIN_ATTEMPTS_CLEANUP_INTERVAL_HOURS=24
    depends_on:
      - mongodb
    secrets:
      - mongodb_uri
      - jwt_secret
      - recaptcha_secret_key
    networks:
      - covenant-network

  mongodb:
    image: mongo:latest
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
    environment:
      - MONGO_INITDB_DATABASE=covenant-match
    volumes:
      - ./mongodb/init-mongo.js:/docker-entrypoint-initdb.d/init-mongo.js:ro
      - mongodb_data:/data/db
    networks:
      - covenant-network
    # Note: not exposing MongoDB port in production for security

  nginx:
    image: covenant-match-nginx:latest
    build:
      context: ./nginx
      dockerfile: Dockerfile
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/ssl:/etc/nginx/ssl
    networks:
      - covenant-network

networks:
  covenant-network:
    driver: overlay

volumes:
  mongodb_data:

secrets:
  mongodb_uri:
    external: true
  jwt_secret:
    external: true
  recaptcha_secret_key:
    external: true