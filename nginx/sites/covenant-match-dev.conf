# Define zone for IP whitelisting
map $http_cf_connecting_ip $allowed_dev_ip {
    default 0;
    46.234.68.71 1;  # My IP 
    136.55.9.159 1;  
    2605:a601:55a2:df00:e189:35b2:c62:9737 1;    # Example IPv6 address
}

# Define a zone to track request rates by IP -> 1 request per minute
limit_req_zone $binary_remote_addr zone=pwdreset:10m rate=1r/m;

# Health check endpoint
server {
    listen 8081;
    
    location / {
        access_log off;
        add_header Content-Type text/plain;
        
        # Allow localhost
        allow 127.0.0.1;
        allow ::1;

        # Allow all Docker overlay networks (covers 10.0.x.x ranges)
        allow 10.0.0.0/8;

        # Allow Docker's internal networks
        allow 172.16.0.0/12;  # Docker's default bridge network range
        allow 172.17.0.0/16;  # Docker's default bridge
        
        # Allow your custom Docker network
        # You may need to adjust this based on your actual network CIDR
        allow 192.168.0.0/16;
        
        # Deny all other access
        deny all;
        
        return 200 'ok';
    }
}

server {
    listen 80;
    server_name dev.covenant-match.com;

    # Only allow whitelisted IPs
    if ($allowed_dev_ip = 0) {
        return 403 "Access Denied: Your IP is not in the whitelist";
    }

    # Do NOT redirect to HTTPS here - Cloudflare is handling this
    # Redirect all HTTP requests to HTTPS
    # return 301 https://$host$request_uri;

    # Specific API routes first
    # Password reset endpoint
    location /api/v1/reset-password-email {
        # Apply rate limiting - 1 request per minute with burst of 3
        limit_req zone=pwdreset burst=3 nodelay;

        # Continue with your proxy_pass to backend
        proxy_pass http://backend:8080/api/v1/reset-password-email;
    } 

    location / {
        proxy_pass http://frontend:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        # Forward Cloudflare geolocation headers
        proxy_set_header CF-IPCountry $http_cf_ipcountry;
        proxy_set_header CF-IPCity $http_cf_ipcity;
        proxy_set_header CF-IPContinent $http_cf_ipcontinent;
        proxy_set_header CF-IPLatitude $http_cf_iplatitude;
        proxy_set_header CF-IPLongitude $http_cf_iplongitude;
        proxy_set_header CF-Region $http_cf_region;
        proxy_set_header CF-RegionCode $http_cf_region_code;
        proxy_set_header CF-MetroCode $http_cf_metro_code;
        proxy_set_header CF-PostalCode $http_cf_postal_code;
        proxy_set_header CF-Timezone $http_cf_timezone;
    }

    # Swagger UI - Don't publish this to prod
    # location /api-docs/ {
    #     proxy_pass http://backend:8080/api-docs/;
    #     proxy_http_version 1.1;
    #     proxy_set_header Upgrade $http_upgrade;
    #     proxy_set_header Connection "upgrade";
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Real-IP $remote_addr;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #     proxy_set_header X-Forwarded-Proto $scheme;
    # }
    
    # There's a critical difference between these two configurations:
    # proxy_pass http://backend:8080/; (original)
    # proxy_pass http://backend:8080/api/; (correct)
    # In the first case, Nginx is essentially "stripping" the /api/ prefix before passing the request to your backend. For example:
    # A request to http://localhost/api/docs/ was being sent to http://backend:8080/docs/
    # A request to http://localhost/api/v1/public/sessions was being sent to http://backend:8080/v1/public/sessions
    # That's why it wasn't matching your authentication exclusion patterns in your Rust middleware, which expects paths to start with /api/.
    # For OpenAPI spec file
    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Forward Cloudflare geolocation headers
        proxy_set_header CF-IPCountry $http_cf_ipcountry;
        proxy_set_header CF-IPCity $http_cf_ipcity;
        proxy_set_header CF-IPContinent $http_cf_ipcontinent;
        proxy_set_header CF-IPLatitude $http_cf_iplatitude;
        proxy_set_header CF-IPLongitude $http_cf_iplongitude;
        proxy_set_header CF-Region $http_cf_region;
        proxy_set_header CF-RegionCode $http_cf_region_code;
        proxy_set_header CF-MetroCode $http_cf_metro_code;
        proxy_set_header CF-PostalCode $http_cf_postal_code;
        proxy_set_header CF-Timezone $http_cf_timezone;
    }

    # Serve uploaded files - proxy to the backend server which now serves the files directly
    location /uploads/ {
        proxy_pass http://backend:8080/uploads/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        
        # Configure timeout values for uploads/downloads
        proxy_connect_timeout 300;
        proxy_send_timeout 300;
        proxy_read_timeout 300;
        
        # Rate limiting for uploads
        limit_req zone=uploads burst=10 nodelay;
        limit_conn uploadconn 10;
    }   
}

server {
    listen 443 ssl;
    server_name dev.covenant-match.com;

    # Only allow whitelisted IPs
    if ($allowed_dev_ip = 0) {
        return 403 "Access Denied: Your IP is not in the whitelist";
    }

    ssl_certificate /etc/nginx/ssl/certificate.pem;
    ssl_certificate_key /etc/nginx/ssl/private.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    # Additional SSL settings
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;

    # Get real IP from Cloudflare
    real_ip_header CF-Connecting-IP;
    
    # Trust Cloudflare IP ranges - this is crucial for security
    # Update these IPs periodically
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
