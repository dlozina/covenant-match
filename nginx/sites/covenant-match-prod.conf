server {
    listen 80;
    server_name covenant-match.com www.covenant-match.com;

    # Do NOT redirect to HTTPS here - Cloudflare is handling this
    # Redirect all HTTP requests to HTTPS
    # return 301 https://$host$request_uri;

    # Specific API routes first
    location = /api/validate-tester-password {
        proxy_pass http://frontend:3000/api/validate-tester-password;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
    }

    location / {
        proxy_pass http://frontend:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        # Forward Cloudflare geolocation headers
        proxy_set_header CF-IPCountry $http_cf_ipcountry;
        proxy_set_header CF-IPCity $http_cf_ipcity;
        proxy_set_header CF-IPContinent $http_cf_ipcontinent;
        proxy_set_header CF-IPLatitude $http_cf_iplatitude;
        proxy_set_header CF-IPLongitude $http_cf_iplongitude;
        proxy_set_header CF-Region $http_cf_region;
        proxy_set_header CF-RegionCode $http_cf_region_code;
        proxy_set_header CF-MetroCode $http_cf_metro_code;
        proxy_set_header CF-PostalCode $http_cf_postal_code;
        proxy_set_header CF-Timezone $http_cf_timezone;
    }

    # Swagger UI - Don't publish this to prod
    # location /api-docs/ {
    #     proxy_pass http://backend:8080/api-docs/;
    #     proxy_http_version 1.1;
    #     proxy_set_header Upgrade $http_upgrade;
    #     proxy_set_header Connection "upgrade";
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Real-IP $remote_addr;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #     proxy_set_header X-Forwarded-Proto $scheme;
    # }
    
    # There's a critical difference between these two configurations:
    # proxy_pass http://backend:8080/; (original)
    # proxy_pass http://backend:8080/api/; (correct)
    # In the first case, Nginx is essentially "stripping" the /api/ prefix before passing the request to your backend. For example:
    # A request to http://localhost/api/docs/ was being sent to http://backend:8080/docs/
    # A request to http://localhost/api/v1/public/sessions was being sent to http://backend:8080/v1/public/sessions
    # That's why it wasn't matching your authentication exclusion patterns in your Rust middleware, which expects paths to start with /api/.
    # For OpenAPI spec file
    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Forward Cloudflare geolocation headers
        proxy_set_header CF-IPCountry $http_cf_ipcountry;
        proxy_set_header CF-IPCity $http_cf_ipcity;
        proxy_set_header CF-IPContinent $http_cf_ipcontinent;
        proxy_set_header CF-IPLatitude $http_cf_iplatitude;
        proxy_set_header CF-IPLongitude $http_cf_iplongitude;
        proxy_set_header CF-Region $http_cf_region;
        proxy_set_header CF-RegionCode $http_cf_region_code;
        proxy_set_header CF-MetroCode $http_cf_metro_code;
        proxy_set_header CF-PostalCode $http_cf_postal_code;
        proxy_set_header CF-Timezone $http_cf_timezone;
    }

    # Serve uploaded files - proxy to the backend server which now serves the files directly
    location /uploads/ {
        proxy_pass http://backend:8080/uploads/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        
        # Configure timeout values for uploads/downloads
        proxy_connect_timeout 300;
        proxy_send_timeout 300;
        proxy_read_timeout 300;
        
        # Rate limiting for uploads
        limit_req zone=uploads burst=10 nodelay;
        limit_conn uploadconn 10;
    }   
}

server {
    listen 443 ssl;
    server_name covenant-match.com www.covenant-match.com;

    ssl_certificate /etc/nginx/ssl/certificate.pem;
    ssl_certificate_key /etc/nginx/ssl/private.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    # Additional SSL settings
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;

    # Get real IP from Cloudflare
    real_ip_header CF-Connecting-IP;
    
    # Trust Cloudflare IP ranges - this is crucial for security
    # Update these IPs periodically
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
