server {
    listen 80;
    server_name localhost;

    # Redirect all HTTP requests to HTTPS
    # Uncomment when SSL is configured
    # return 301 https://$host$request_uri;

    # For development without SSL
    location / {
        proxy_pass http://frontend:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
    }

    
    location /api-docs/ {
        proxy_pass http://backend:8080/api-docs/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    
    # There's a critical difference between these two configurations:
    # proxy_pass http://backend:8080/; (original)
    # proxy_pass http://backend:8080/api/; (correct)
    # In the first case, Nginx is essentially "stripping" the /api/ prefix before passing the request to your backend. For example:
    # A request to http://localhost/api/docs/ was being sent to http://backend:8080/docs/
    # A request to http://localhost/api/v1/public/sessions was being sent to http://backend:8080/v1/public/sessions
    # That's why it wasn't matching your authentication exclusion patterns in your Rust middleware, which expects paths to start with /api/.
    # For OpenAPI spec file
    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Add debugging header
        add_header X-Debug-Message "Accessed through Nginx general /api/ location" always;
    }   
}

