environment = "production"

[server]
workers = 4       # More workers for production
host = "0.0.0.0"  # Listen on all interfaces
port = 8080       # Default port, can be overridden by env vars

[domain]
primary = "covenant-match.com"
www = "www.covenant-match.com"
internal_service_name = "backend"
allow_local = false  # Don't allow local testing in production

# The database URL and JWT secret should be set via environment variables
# in production using CONFIG_DATABASE__URL and CONFIG_JWT__SECRET 

# The rest of the settings will be inherited from default.toml 