environment = "development"

[database]
url = "mongodb://localhost:27017"

[jwt]
secret = "malenia_is_the_best_girl_in_the_world"
email_secret = "promised_consort_radahn"
reset_password_secret = "dancing_lion_in_the_wind"
# Duration formats:
# - "30s" = 30 seconds
# - "10m" = 10 minutes
# - "12h" = 12 hours (recommended for production)
# - "7d" = 7 days (for longer sessions)
expires_in = "12h" 

[server]
port = 8080
host = "0.0.0.0"
workers = 2

[domain]
primary = "localhost"
www = "localhost"
allow_local = true  # Allow local testing in development

[realtime]
# Use WebSockets (true) or Server-Sent Events (false)
use_websockets = true
# Configure max age of inactive sessions in seconds (default 24h)
session_inactive_timeout = 86400 # 24 hours

[chat]
cleanup_interval_seconds = 86400 # 1 day (86400 seconds)
inactive_seconds = 86400 # 1 day (86400 seconds)

[auth]
# Exclude patterns format: [path, method, is_regex]
# method can be "GET", "POST", etc. or null for any method
# is_regex is a boolean (true/false)
exclude_patterns = [
    { path = "/api/v1/auth/login", method = "POST", is_regex = false },
    { path = "/api/v1/register", method = "POST", is_regex = false },
    { path = "/api/docs/.*", method = "GET", is_regex = true },
    { path = "/api-docs/.*", method = "GET", is_regex = true },
    { path = "/api/v1/game-data", method = "GET", is_regex = false },
    # statistics
    { path = "/api/v1/statistics/sessions-stats", method = "GET", is_regex = false },
    { path = "/api/v1/statistics/leaderboard", method = "GET", is_regex = false },
    { path = "/api/v1/statistics/covenants", method = "GET", is_regex = false },
    { path = "/api/v1/public/sessions", method = "GET", is_regex = false },
    # Dropdown data
    { path = "/api/v1/night-lords", method = "GET", is_regex = false },
    # Verify email
    { path = "/api/v1/verify-email", method = "POST", is_regex = false },
    # Reset password
    { path = "/api/v1/reset-password-email", method = "POST", is_regex = false },
    { path = "/api/v1/reset-password", method = "POST", is_regex = false },
    # Uncomment to allow WebSocket and SSE connections without auth
    # (they use token in query parameter instead)
    { path = "/api/v1/ws/.*", method = "GET", is_regex = true },
    # { path = "/api/v1/sse/.*", method = "GET", is_regex = true },
    # { path = "/api/public/.*", method = "GET", is_regex = true },
    # { path = "/favicon.ico", method = "GET", is_regex = false },
    # Serve uploaded files
    { path = "/uploads/.*", method = "GET", is_regex = true },
    # Serve news
    { path = "/api/v1/news", method = "GET", is_regex = false },
    { path = "/api/v1/news/.*", method = "GET", is_regex = true },
    { path = "/api/v1/announcements/current", method = "GET", is_regex = false },
    # Internal health check
    { path = "/internal/health", method = "GET", is_regex = false },
    # Donations
    { path = "/api/v1/payment/create-payment-intent", method = "POST", is_regex = false },
    { path = "/api/v1/payment/verify-payment", method = "POST", is_regex = false },
] 

[email]
frontend_url = "http://localhost"
