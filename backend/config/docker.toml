environment = "docker"

[database]
# In Docker, we typically connect to other containers by service name
url = "mongodb://mongodb:27017"

[server]
port = 8080
host = "0.0.0.0"  # Bind to all interfaces inside container
workers = 2

# JWT settings should be provided via environment variables in Docker:
# CONFIG_JWT__SECRET
# CONFIG_JWT__EXPIRES_IN

[auth]
# Auth config is inherited from default.toml 