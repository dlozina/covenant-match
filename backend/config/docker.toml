environment = "docker"

[database]
# In Docker, we typically connect to other containers by service name
url = "mongodb://mongodb:27017"

[server]
port = 8080
host = "0.0.0.0"  # Listen on all interfaces in container
workers = 4

# JWT settings should be provided via environment variables in Docker:
# CONFIG_JWT__SECRET
# CONFIG_JWT__EXPIRES_IN

[auth]
# Auth config is inherited from default.toml 

[domain]
primary = "covenant-match.com"
www = "www.covenant-match.com"
internal_service_name = "backend"
allow_local = false 

# The rest of the settings will be inherited from default.toml 