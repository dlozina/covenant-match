[package]
name = "covenant-match-backend"
version = "0.1.0"
edition = "2021"

[dependencies]
actix-web = "4.4.0"
actix-cors = "0.6.4"
actix-rt = "2.9.0"
actix-web-actors = "4.2.0"
actix = "0.13.1"
serde = { version = "1.0.188", features = ["derive"] }
serde_json = "1.0.107"
tokio = { version = "1.32.0", features = ["full"] }
mongodb = "2.6.1"
futures = "0.3.28"
chrono = { version = "0.4.31", features = ["serde"] }
dotenv = "0.15.0"
env_logger = "0.10.0"
log = "0.4.20"
uuid = { version = "1.4.1", features = ["v4", "serde"] }
thiserror = "1.0.48"
derive_more = "0.99.17"
bcrypt = "0.15.0"
jsonwebtoken = "8.3.0"
config = "0.13.3"
rand = "0.8.5"
once_cell = "1.18.0"
validator = { version = "0.16.1", features = ["derive"] }
actix-files = "0.6.2"

[dev-dependencies]
actix-rt = "2.9.0"
