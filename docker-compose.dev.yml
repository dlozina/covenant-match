services:
  frontend:
    image: ghcr.io/dlozina/covenant-match-frontend:dev
    deploy:
      replicas: 1
      # resources:
      #   limits:
      #     cpus: '0.5'
      #     memory: 1.5G
      restart_policy:
        condition: on-failure
      update_config:
        order: start-first
        parallelism: 1
        delay: 10s
        failure_action: rollback
        monitor: 5s
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_BASE_URL=https://dev.covenant-match.com
      - NEXT_PUBLIC_TURNSTILE_SITE_KEY=0x4AAAAAABYet9mhK3xghhXA
      - NEXT_PUBLIC_DISABLE_AUTO_REDIRECT=true
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "curl", "-f", "-s", "-H", "Host: localhost", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - covenant-network

  backend:
    image: ghcr.io/dlozina/covenant-match-backend:dev
    deploy:
      replicas: 1
      # resources:
      #   limits:
      #     cpus: '2'
      #     memory: 3G
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s
      update_config:
        order: start-first
        parallelism: 1
        delay: 10s
        failure_action: rollback
        monitor: 5s
    environment:
      - RUST_ENV=development
      - RUST_LOG=info
      - PORT=8080
      - LOGIN_ATTEMPTS_RETENTION_DAYS=30
      - LOGIN_ATTEMPTS_CLEANUP_INTERVAL_HOURS=24
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      - mongodb
    healthcheck:
      test: ["CMD", "curl", "-f", "-s", "-H", "Host: localhost", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    secrets:
      - mongodb_uri
      - jwt_secret
      - turnstile_secret_key
      - mailersend_api_key
    networks:
      - covenant-network

  mongodb:
    image: mongo:latest
    deploy:
      replicas: 1
      # resources:
      #   limits:
      #     cpus: '1'
      #     memory: 3G
      restart_policy:
        condition: on-failure
      update_config:
        order: start-first
        parallelism: 1
        delay: 10s
        failure_action: rollback
        monitor: 5s
    environment:
      - MONGO_INITDB_DATABASE=covenant-match
    volumes:
      - mongodb_data:/data/db
    command: mongod --wiredTigerCacheSizeGB 1.5 --wiredTigerCollectionBlockCompressor=zlib --wiredTigerJournalCompressor=snappy --wiredTigerIndexPrefixCompression=true
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - covenant-network
    

  nginx:
    image: ghcr.io/dlozina/covenant-match-nginx-dev:devtag
    deploy:
      replicas: 1
      # resources:
      #   limits:
      #     cpus: '0.5'
      #     memory: 0.5G
      restart_policy:
        condition: on-failure
      update_config:
        order: start-first
        parallelism: 1
        delay: 10s
        failure_action: rollback
        monitor: 5s
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./ssl:/etc/nginx/ssl:ro
      - ./logs/nginx:/var/log/nginx
    healthcheck:
      test: ["CMD", "curl", "-f", "-s", "-H", "Host: localhost", "http://localhost:8081/"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - covenant-network
  
  mongodb-backup:
    image: ghcr.io/dlozina/covenant-match-mongodb-backup:latest
    deploy:
      # resources:
      #   limits:
      #     cpus: '0.2'
      #     memory: 0.5G
      update_config:
        order: start-first
        parallelism: 1
        delay: 10s
        failure_action: rollback
        monitor: 5s
    environment:
      - BACKUP_SCHEDULE=0 6 * * *  # Run at 6:00 AM every day
      - BACKUP_RETENTION_DAYS=7    # Keep backups for 7 days (default)
    volumes:
      - mongodb_backup_data:/backups  # Persistent volume for backups
    depends_on:
      - mongodb
    networks:
      - covenant-network

networks:
  covenant-network:
    driver: overlay

volumes:
  mongodb_data:
  uploads_data:
  mongodb_backup_data:
secrets:
  mongodb_uri:
    external: true
  jwt_secret:
    external: true
  turnstile_secret_key:
    external: true
  mailersend_api_key:
    external: true