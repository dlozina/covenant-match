name: Build All Nginx Images

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to use (defaults to latest if empty)'
        required: false
        default: 'latest'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      # Build and push Nginx Production image
      - name: Build and push Nginx Production image
        uses: docker/build-push-action@v4
        with:
          context: ./nginx
          file: ./nginx/Dockerfile
          build-args: |
            ENVIRONMENT=prod
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/covenant-match-nginx:${{ inputs.tag }}
            ghcr.io/${{ github.repository_owner }}/covenant-match-nginx:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Build and push Nginx Development image
      - name: Build and push Nginx Development image
        uses: docker/build-push-action@v4
        with:
          context: ./nginx
          file: ./nginx/Dockerfile
          build-args: |
            ENVIRONMENT=dev
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/covenant-match-nginx-dev:${{ inputs.tag }}
            ghcr.io/${{ github.repository_owner }}/covenant-match-nginx-dev:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max 