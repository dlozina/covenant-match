name: Build Nginx Development Image

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to use for dev image (defaults to latest if empty)'
        required: false
        default: 'latest'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      # Debug: List files in nginx/sites directory
      - name: Debug - List configuration files
        run: |
          echo "Listing nginx/sites directory:"
          ls -la nginx/sites/

      # Build and push Nginx Development image
      - name: Build and push Nginx Development image
        uses: docker/build-push-action@v4
        with:
          context: ./nginx
          file: ./nginx/Dockerfile
          build-args: |
            ENVIRONMENT=dev
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/covenant-match-nginx-dev:${{ inputs.tag }}
            ghcr.io/${{ github.repository_owner }}/covenant-match-nginx-dev:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Add build output to see what's happening
          outputs: type=docker,dest=/tmp/image.tar
          
      # Debug: Verify the built image
      - name: Debug - Verify built image
        run: |
          echo "Loading image for inspection..."
          docker load < /tmp/image.tar
          echo "Inspecting image configuration..."
          docker run --rm ghcr.io/${{ github.repository_owner }}/covenant-match-nginx-dev:${{ github.sha }} cat /etc/nginx/conf.d/covenant-match.conf | head -n 5 