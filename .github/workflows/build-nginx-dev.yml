name: Build Nginx Development Image

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to use for dev image (defaults to latest if empty)'
        required: false
        default: 'latest'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      # Debug: List files in nginx/sites directory
      - name: Debug - List configuration files
        run: |
          echo "Listing nginx/sites directory:"
          ls -la nginx/sites/
      
      # Display the tags that will be used
      - name: Display image tags
        run: |
          echo "Building with the following tags:"
          echo "- Custom tag: ghcr.io/${{ github.repository_owner }}/covenant-match-nginx-dev:${{ inputs.tag }}"
          echo "- SHA tag: ghcr.io/${{ github.repository_owner }}/covenant-match-nginx-dev:${{ github.sha }}"

      # Build and push Nginx Development image
      - name: Build and push Nginx Development image
        uses: docker/build-push-action@v4
        with:
          context: ./nginx
          file: ./nginx/Dockerfile
          build-args: |
            ENVIRONMENT=dev
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/covenant-match-nginx-dev:${{ inputs.tag }}
            ghcr.io/${{ github.repository_owner }}/covenant-match-nginx-dev:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          outputs: type=docker,dest=/tmp/image.tar
          
      # Debug: Verify the built image
      - name: Debug - Verify built image
        run: |
          echo "Loading image for inspection..."
          docker load < /tmp/image.tar
          
          # List all loaded images to verify both tags exist
          echo "Listing created images:"
          docker images | grep covenant-match-nginx-dev
          
          # Verify configuration using the custom tag
          echo "Inspecting image with custom tag (${{ inputs.tag }}):"
          docker run --rm ghcr.io/${{ github.repository_owner }}/covenant-match-nginx-dev:${{ inputs.tag }} cat /etc/nginx/conf.d/covenant-match.conf | head -n 5
          
          # Also verify with SHA tag for completeness
          echo "Inspecting image with SHA tag:"
          docker run --rm ghcr.io/${{ github.repository_owner }}/covenant-match-nginx-dev:${{ github.sha }} cat /etc/nginx/conf.d/covenant-match.conf | head -n 5
          
      - name: Summary
        run: |
          echo "Build and push completed. Images should be available at:"
          echo "- ghcr.io/${{ github.repository_owner }}/covenant-match-nginx-dev:${{ inputs.tag }}"
          echo "- ghcr.io/${{ github.repository_owner }}/covenant-match-nginx-dev:${{ github.sha }}" 