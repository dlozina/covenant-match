name: Build MongoDB Backup Image

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to use (defaults to latest if empty)'
        required: false
        default: 'latest'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      # Build and push MongoDB Backup image
      - name: Build and push MongoDB Backup image
        uses: docker/build-push-action@v4
        with:
          context: ./mongodb-backup
          file: ./mongodb-backup/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/covenant-match-mongodb-backup:${{ inputs.tag }}
            ghcr.io/${{ github.repository_owner }}/covenant-match-mongodb-backup:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max 